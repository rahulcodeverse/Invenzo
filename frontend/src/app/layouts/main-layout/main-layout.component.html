<nz-layout class="app-layout">
  <nz-header class="top-shell">
    <div class="top-bar">
      <a routerLink="/" class="brand">
        <img src="assets/brand/invenzo-logo.svg" alt="Invenzo" />
      </a>

      <nav class="module-nav" aria-label="Primary navigation">
        <a
          *ngFor="let item of filteredMenuItems"
          class="module-link"
          [class.active]="isTopItemActive(item)"
          [routerLink]="item.link || item.children?.[0]?.link"
        >
          <span nz-icon [nzType]="item.icon"></span>
          <span>{{ item.title }}</span>
        </a>
      </nav>

      <div class="header-right">
        <a routerLink="/inventory/stock" class="quick-link">
          <span nz-icon nzType="inbox"></span>
          Stock
        </a>

        <a
          nz-dropdown
          [nzDropdownMenu]="notificationMenu"
          nzTrigger="click"
          class="notification-trigger"
          (click)="loadNotifications()"
        >
          <nz-badge [nzCount]="unreadCount" [nzOverflowCount]="9">
            <span nz-icon nzType="bell"></span>
          </nz-badge>
        </a>

        <nz-dropdown-menu #notificationMenu="nzDropdownMenu">
          <div class="notification-panel">
            <div class="notification-panel__header">
              <strong>Notifications</strong>
              <button nz-button nzType="link" nzSize="small" (click)="markAllNotificationsRead()">
                Mark all read
              </button>
            </div>

            <div class="notification-empty" *ngIf="!notifications.length">
              No notifications yet
            </div>

            <button
              *ngFor="let notification of notifications"
              class="notification-item"
              [class.unread]="!notification.isRead"
              (click)="markNotificationRead(notification)"
            >
              <span
                class="notification-dot"
                [style.background]="getNotificationColor(notification.type)"
              ></span>
              <span class="notification-copy">
                <strong>{{ notification.title }}</strong>
                <span>{{ notification.message }}</span>
                <small>{{ notification.createdAt | date:'dd MMM, h:mm a' }}</small>
              </span>
            </button>
          </div>
        </nz-dropdown-menu>

        <a
          nz-dropdown
          [nzDropdownMenu]="menu"
          nzTrigger="click"
          class="user-dropdown"
        >
          <nz-avatar [nzText]="userInitials" nzSize="small"></nz-avatar>
          <span class="user-name">{{ userName }}</span>
          <span nz-icon nzType="down"></span>
        </a>

        <nz-dropdown-menu #menu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-item>
              <span nz-icon nzType="user"></span>
              Profile
            </li>
            <li nz-menu-item routerLink="/settings/company">
              <span nz-icon nzType="setting"></span>
              Settings
            </li>
            <li nz-menu-divider></li>
            <li nz-menu-item (click)="logout()">
              <span nz-icon nzType="logout"></span>
              Logout
            </li>
          </ul>
        </nz-dropdown-menu>
      </div>
    </div>

    <div class="sub-tab-bar" *ngIf="activeChildren.length">
      <a
        *ngFor="let child of activeChildren"
        class="sub-tab"
        [class.active]="isChildActive(child.link)"
        [routerLink]="child.link"
      >
        {{ child.title }}
      </a>
    </div>
  </nz-header>

  <nz-content>
    <div class="inner-content">
      <div class="route-context" *ngIf="activeMenuItem">
        <a [routerLink]="activeMenuItem.link || activeMenuItem.children?.[0]?.link">
          {{ activeMenuItem.title }}
        </a>
        <span *ngIf="activeChildTitle" nz-icon nzType="arrow-right"></span>
        <a *ngIf="activeChildTitle && activeChildLink" [routerLink]="activeChildLink">
          {{ activeChildTitle }}
        </a>
      </div>

      <router-outlet></router-outlet>
    </div>
  </nz-content>
</nz-layout>
