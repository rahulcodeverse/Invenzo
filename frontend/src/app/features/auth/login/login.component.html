<div class="login-container">
  <main class="login-stage">
    <section class="visual-panel">
      <header class="brand-row">
        <img src="assets/brand/invenzo-logo.svg" alt="Invenzo" />
        <span>ERP workspace</span>
      </header>

      <img class="hero-image" src="assets/login/logistics-hero.png" alt="Isometric logistics and warehouse illustration" />

      <div class="visual-copy">
        <span class="slide-count">0{{ activeSlideIndex + 1 }} / 04</span>
        <p class="eyebrow">{{ activeSlide.eyebrow }}</p>
        <h1>{{ activeSlide.title }}</h1>
        <p>{{ activeSlide.body }}</p>
        <div class="slide-metric">
          <span>{{ activeSlide.metric }}</span>
        </div>
      </div>

      <div class="carousel-controls" aria-label="Login carousel controls">
        <button type="button" (click)="previousSlide()" aria-label="Previous slide">
          <span nz-icon nzType="arrow-left"></span>
        </button>
        <button type="button" (click)="advanceSlide()" aria-label="Next slide">
          <span nz-icon nzType="arrow-right"></span>
        </button>
      </div>

      <div class="slide-dots" aria-label="Login carousel slides">
        <button
          *ngFor="let slide of slides; let i = index"
          type="button"
          [class.active]="i === activeSlideIndex"
          (click)="selectSlide(i)"
          [attr.aria-label]="'Show slide ' + (i + 1)"
        >
          <span></span>
        </button>
      </div>
    </section>

    <section class="login-card">
      <div class="mobile-brand">
        <img src="assets/brand/invenzo-logo.svg" alt="Invenzo" />
      </div>

      <div class="login-header">
        <p class="eyebrow">Secure login</p>
        <h2>Welcome to Invenzo</h2>
        <p>Sign in to open your business workspace.</p>
      </div>

      <form nz-form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <nz-form-item>
          <nz-form-control nzErrorTip="Please input your email!">
            <label class="field-label">Email address</label>
            <nz-input-group [nzPrefix]="userPrefix">
              <input
                type="email"
                nz-input
                formControlName="email"
                placeholder="owner@invenzo.com"
              />
            </nz-input-group>
            <ng-template #userPrefix>
              <span nz-icon nzType="user"></span>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Please input your password!">
            <label class="field-label">Password</label>
            <nz-input-group [nzPrefix]="lockPrefix">
              <input
                type="password"
                nz-input
                formControlName="password"
                placeholder="Enter password"
              />
            </nz-input-group>
            <ng-template #lockPrefix>
              <span nz-icon nzType="lock"></span>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <div class="form-options">
          <label nz-checkbox formControlName="remember">
            <span>Keep me signed in</span>
          </label>
          <a routerLink="/auth/forgot-password">Reset password</a>
        </div>

        <button
          nz-button
          class="login-form-button"
          [nzType]="'primary'"
          [nzLoading]="loading"
          [disabled]="!loginForm.valid"
        >
          <span nz-icon nzType="login"></span>
          Open workspace
        </button>
      </form>

      <button type="button" class="demo-credentials" (click)="useDemoCredentials()">
        <div>
          <strong>Try owner workspace</strong>
          <span>owner&#64;invenzo.com</span>
        </div>
        <span class="demo-action">Fill demo</span>
      </button>
    </section>
  </main>
</div>
