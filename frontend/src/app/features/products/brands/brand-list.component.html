<nz-card>
  <div class="page-header">
    <div class="header-left">
      <h2>Brands</h2>
      <p>Manage product brands</p>
    </div>
    <div class="header-right">
      <button nz-button nzType="primary" (click)="openCreateModal()">
        <span nz-icon nzType="plus"></span>
        Add Brand
      </button>
    </div>
  </div>

  <nz-table
    #brandsTable
    [nzData]="brands"
    [nzLoading]="loading"
    [nzPageSize]="20"
    nzSize="middle"
  >
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th nzAlign="center">Status</th>
        <th nzAlign="center" nzWidth="120px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let brand of brandsTable.data">
        <td>
          <strong>{{ brand.name }}</strong>
        </td>
        <td>{{ brand.description || '-' }}</td>
        <td nzAlign="center">
          <nz-tag [nzColor]="brand.isActive ? 'green' : 'red'">
            {{ brand.isActive ? 'Active' : 'Inactive' }}
          </nz-tag>
        </td>
        <td nzAlign="center">
          <nz-space>
            <button
              *nzSpaceItem
              nz-button
              nzType="default"
              nzSize="small"
              (click)="openEditModal(brand)"
            >
              <span nz-icon nzType="edit"></span>
            </button>
            <button
              *nzSpaceItem
              nz-button
              nzType="default"
              nzDanger
              nzSize="small"
              (click)="confirmDelete(brand)"
            >
              <span nz-icon nzType="delete"></span>
            </button>
          </nz-space>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>

<!-- Brand Form Modal -->
<nz-modal
  [(nzVisible)]="modalVisible"
  [nzTitle]="modalTitle"
  (nzOnCancel)="handleModalCancel()"
  (nzOnOk)="handleModalOk()"
  nzWidth="600px"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="brandForm" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired>Brand Name</nz-form-label>
        <nz-form-control nzErrorTip="Please enter brand name (min 2 characters)">
          <input nz-input formControlName="name" placeholder="Enter brand name" />
        </nz-form-control>
      </nz-form-item>


      <nz-form-item>
        <nz-form-label>Description</nz-form-label>
        <nz-form-control>
          <textarea
            nz-input
            formControlName="description"
            [nzAutosize]="{ minRows: 2, maxRows: 4 }"
            placeholder="Enter description"
          ></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item *ngIf="isEditMode">
        <nz-form-label>Status</nz-form-label>
        <nz-form-control>
          <nz-switch formControlName="isActive"></nz-switch>
          <span class="status-label">
            {{ brandForm.get('isActive')?.value ? 'Active' : 'Inactive' }}
          </span>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
